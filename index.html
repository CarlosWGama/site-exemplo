<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página de Exemplo de Teste</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      color: #2d3748;
      padding: 1rem;
    }

    .card {
      background: #ffffff;
      padding: 2.5rem 3rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
      max-width: 480px;
      width: 100%;
    }

    .badge {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      background-color: #e2e8f0;
      color: #4a5568;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 0.75rem;
    }

    p {
      color: #718096;
      font-size: 1rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Ambiente de Teste</span>
    <h1>Página de Exemplo de Teste</h1>
    <p>Esta é apenas uma página de exemplo para testes.</p>
  </main>
</body>
</html>
